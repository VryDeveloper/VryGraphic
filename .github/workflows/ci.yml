name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vry
          POSTGRES_PASSWORD: vry
          POSTGRES_DB: vrygraphic
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vry" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://vry:vry@localhost:5432/vrygraphic?schema=public
      # com esta variável os testes de integração rodam contra o Postgres do serviço acima
      TEST_DATABASE_URL: postgresql://vry:vry@localhost:5432/vrygraphic?schema=public
      JWT_SECRET: segredo-so-da-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy -w apps/api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web

  docker:
    # garante que a imagem de produção continua montando (API + front)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vrygraphic .
